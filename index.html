<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>

  <!-- link css -->
  <link rel="stylesheet" href="style.css">

  <!-- link font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="calculator">
      <div class="header">
        <input type="text" id="inputBox">
      </div>
      <div class="footer">
        <button onclick="clearAll()" class="silver-btns">C</button>
        <button onclick="dlt()" class="silver-btns">Del</button>
        <button onclick="buttonClick('/')" class="green-btns">/</button>
        <button onclick="buttonClick('*')" class="green-btns">*</button>
        <button onclick="buttonClick(7)" class="green-num-btns">7</button>
        <button onclick="buttonClick(8)" class="green-num-btns">8</button>
        <button onclick="buttonClick(9)" class="green-num-btns">9</button>
        <button onclick="buttonClick('-')" class="green-btns">-</button>
        <button onclick="buttonClick(4)" class="green-num-btns">4</button>
        <button onclick="buttonClick(5)" class="green-num-btns">5</button>
        <button onclick="buttonClick(6)" class="green-num-btns">6</button>
        <button onclick="buttonClick('+')" class="green-btns plus-btn">+</button>
        <button onclick="buttonClick(1)" class="green-num-btns">1</button>
        <button onclick="buttonClick(2)" class="green-num-btns">2</button>
        <button onclick="buttonClick(3)" class="green-num-btns">3</button>
        <button onclick="buttonClick(0)" class="green-num-btns">0</button>
        <button onclick="buttonClick('.')" class="green-num-btns">.</button>
        <button onclick="result()" class="green-btns equal-btn">=</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
